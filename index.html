<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DATA CENTER: 绝命猎杀</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; touch-action: none; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* 摄影机电量 UI */
        #cam-ui {
            position: absolute; top: 20px; left: 20px; 
            display: flex; align-items: center; gap: 8px; pointer-events: none;
            color: #fff; font-size: 14px; text-shadow: 0 0 5px #000; z-index: 10;
        }
        #cam-battery {
            width: 40px; height: 20px; border: 2px solid #fff; border-radius: 3px; padding: 2px;
            display: flex; gap: 2px; position: relative;
        }
        #cam-battery::after { content: ''; position: absolute; right: -6px; top: 5px; width: 4px; height: 8px; background: #fff; }
        .cam-cell { flex: 1; background: #fff; height: 100%; transition: opacity 0.3s; }
        .cam-cell.empty { opacity: 0.1; }

        #alert { color: #ff7b72; font-size: 20px; font-weight: bold; opacity: 0; transition: opacity 0.3s; text-shadow: 0 0 15px #ff0000; position: absolute; top: 80px; width: 100%; text-align: center; z-index: 10;}
        
        #toggle-btn {
            position: absolute; bottom: 30px; right: 30px;
            padding: 12px 25px; background: transparent; border: 1px solid #4a5260; color: #c9d1d9;
            font-size: 16px; cursor: pointer; border-radius: 4px; pointer-events: auto; display: none; z-index: 10;
        }
        #toggle-btn.on { border-color: #fff; color: #fff; box-shadow: 0 0 10px #fff; }

        #start-btn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            padding: 15px 40px; background: transparent; border: 2px solid #c9d1d9; color: #c9d1d9; 
            font-size: 20px; letter-spacing: 2px; pointer-events: auto; cursor: pointer; font-weight: bold; z-index: 10;
        }

        /* 结算黑屏 */
        #game-over-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: none; z-index: 100;
            cursor: pointer;
        }

        /* 剧情对话框 (去掉了红条) */
        #dialogue-box {
            position: absolute; bottom: 12%; left: 5%; width: 90%; min-height: 160px;
            background: rgba(10, 10, 12, 0.95);
            border-radius: 4px;
            display: none; flex-direction: column; justify-content: flex-start; align-items: flex-start;
            padding: 15px 20px; box-sizing: border-box;
            opacity: 0; transition: opacity 0.5s ease;
        }

        #speaker-name {
            color: #ff2a2a; font-size: 14px; font-weight: bold; font-family: 'Times New Roman', serif; 
            margin-bottom: 8px; letter-spacing: 1px;
        }

        #dialogue-text {
            color: #e6edf3; font-size: 14px; line-height: 1.6; letter-spacing: 1px;
        }

        #input-container {
            display: none; width: 100%; margin-top: 15px;
        }
        #input-box {
            width: 100%; background: transparent; border: none; border-bottom: 1px solid #666;
            color: #fff; font-size: 13px; padding: 5px 0; outline: none;
        }
        #input-box::placeholder { color: #444; }

        /* 底部菜单栏 */
        #bottom-menu {
            position: absolute; bottom: 4%; left: 0; width: 100%;
            display: none; justify-content: center; gap: 30px;
            opacity: 0; transition: opacity 1s ease;
        }
        .menu-btn {
            color: #ccc; font-size: 14px; letter-spacing: 2px; cursor: pointer; transition: color 0.2s;
        }
        .menu-btn:hover { color: #fff; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="cam-ui">
        <div>REC</div>
        <div id="cam-battery">
            <div class="cam-cell" id="cam0"></div>
            <div class="cam-cell" id="cam1"></div>
            <div class="cam-cell" id="cam2"></div>
            <div class="cam-cell" id="cam3"></div>
            <div class="cam-cell" id="cam4"></div>
        </div>
    </div>

    <div id="alert">!!! 猎手锁定你了 !!!</div>
    
    <button id="toggle-btn" onclick="toggleLight()">[ 关手电 (F) ]</button>
    <button id="start-btn">REC ● 开始录制</button>

    <!-- 结算界面 -->
    <div id="game-over-screen" onclick="nextDialogue(event)">
        <div id="dialogue-box">
            <div id="speaker-name">未知</div>
            <div id="dialogue-text"></div>
            <div id="input-container">
                <input type="text" id="input-box" placeholder="输入回应..." autocomplete="off">
            </div>
        </div>

        <div id="bottom-menu">
            <div class="menu-btn" id="back-btn" onclick="goBack(event)">回退</div>
            <div class="menu-btn" id="restart-btn" onclick="location.reload()" style="display:none;">重新开始？</div>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let gameState = 'menu'; 
const tileSize = 40; 
const mapWidth = 30; 
const mapHeight = 25;
let map = []; 

let player = { 
    x: 2.5, y: 2.5, r: 10, speed: 0.06, vx: 0, vy: 0, angle: 0, 
    maxLightRadius: 320, currentLightRadius: 0, 
    isLightOn: true, 
    isEmp: false, empTimer: 0,
    stepTimer: 0, batteryCells: 5, timeAccumulator: 0, flickerTimer: 0
};

let chaser = { 
    x: 15, y: 15, r: 12, 
    angle: Math.PI, fov: Math.PI / 3, lightRadius: 320,
    isLightOn: false, stepTimer: 0,
    chaseTimer: 0, isFading: false 
};
let exitTile = { x: 0, y: 0 };

let deathSequence = 0; 
let touchStart = { x: 0, y: 0 };
let isTouching = false;

const alertEl = document.getElementById('alert');
const toggleBtn = document.getElementById('toggle-btn');
const backBtn = document.getElementById('back-btn');
const restartBtn = document.getElementById('restart-btn');
const inputContainer = document.getElementById('input-container');
const inputBox = document.getElementById('input-box');
const dName = document.getElementById('speaker-name');
const dText = document.getElementById('dialogue-text');
const dBox = document.getElementById('dialogue-box');
const bMenu = document.getElementById('bottom-menu');

function updateCamUI() {
    for(let i=0; i<5; i++) {
        let cell = document.getElementById('cam'+i);
        if(i < player.batteryCells) cell.className = 'cam-cell';
        else cell.className = 'cam-cell empty';
    }
}

function toggleLight() {
    if (player.isEmp || gameState !== 'playing' || player.batteryCells <= 0) return;
    player.isLightOn = !player.isLightOn;
    if (player.isLightOn) {
        toggleBtn.classList.add('on');
        toggleBtn.innerText = "[ 关手电 (F) ]";
    } else {
        toggleBtn.classList.remove('on');
        toggleBtn.innerText = "[ 开手电 (F) ]";
    }
}

function generateServerRoom() {
    map = Array(mapHeight).fill().map(() => Array(mapWidth).fill(1)); 
    function fillRect(x, y, w, h, val) {
        for (let iy = y; iy < y + h; iy++) {
            for (let ix = x; ix < x + w; ix++) {
                if (ix >= 0 && ix < mapWidth && iy >= 0 && iy < mapHeight) map[iy][ix] = val;
            }
        }
    }
    fillRect(1, 1, mapWidth-2, 2, 0); 
    fillRect(1, mapHeight-3, mapWidth-2, 2, 0); 
    fillRect(1, 1, 2, mapHeight-2, 0); 
    fillRect(mapWidth-3, 1, 2, mapHeight-2, 0); 

    for (let i = 0; i < 15; i++) {
        let rx = 4 + Math.floor(Math.random() * (mapWidth - 8));
        let ry = 4 + Math.floor(Math.random() * (mapHeight - 8));
        let rw = 3 + Math.floor(Math.random() * 4);
        let rh = 3 + Math.floor(Math.random() * 4);
        fillRect(rx, ry, rw, rh, 1);
        if (Math.random() > 0.5) fillRect(rx - 1, ry, 1, rh + 1, 0); 
        else fillRect(rx, ry - 1, rw + 1, 1, 0);
    }
    fillRect(1, 12, mapWidth - 2, 2, 0); 
    fillRect(14, 1, 2, mapHeight - 2, 0); 

    exitTile = { x: mapWidth - 3.5, y: mapHeight - 3.5 };
    map[mapHeight - 3][mapWidth - 3] = 2;
}

function isWall(x, y, r) {
    let minX = Math.floor((x - r) / tileSize);
    let maxX = Math.floor((x + r) / tileSize);
    let minY = Math.floor((y - r) / tileSize);
    let maxY = Math.floor((y + r) / tileSize);
    for (let iy = minY; iy <= maxY; iy++) {
        for (let ix = minX; ix <= maxX; ix++) {
            if (ix < 0 || ix >= mapWidth || iy < 0 || iy >= mapHeight) return true;
            if (map[iy][ix] === 1) {
                let dx = Math.max(ix * tileSize, Math.min(x, (ix + 1) * tileSize));
                let dy = Math.max(iy * tileSize, Math.min(y, (iy + 1) * tileSize));
                if (Math.hypot(x - dx, y - dy) < r) return true;
            }
        }
    }
    return false;
}

document.getElementById('start-btn').onclick = () => {
    document.getElementById('start-btn').style.display = 'none';
    generateServerRoom();
    player = { 
        x: 2.5 * tileSize, y: 2.5 * tileSize, r: 10, speed: 0.06, vx: 0, vy: 0, angle: 0, 
        maxLightRadius: 320, currentLightRadius: 0, 
        isLightOn: true, isEmp: false, empTimer: 0,
        stepTimer: 0, batteryCells: 5, timeAccumulator: 0, flickerTimer: 0
    };
    chaser = { 
        x: mapWidth/2 * tileSize, y: mapHeight/2 * tileSize, r: 12, 
        angle: Math.PI, fov: Math.PI / 3, lightRadius: 320, 
        isLightOn: false, stepTimer: 0, chaseTimer: 0, isFading: false
    };
    gameState = 'playing';
    toggleBtn.style.display = 'block';
    toggleBtn.classList.add('on');
    toggleBtn.innerText = "[ 关手电 (F) ]";
    updateCamUI();
};

window.addEventListener('keydown', (e) => {
    if (e.key === 'w' || e.key === 'ArrowUp') player.vy = -1;
    if (e.key === 's' || e.key === 'ArrowDown') player.vy = 1;
    if (e.key === 'a' || e.key === 'ArrowLeft') player.vx = -1;
    if (e.key === 'd' || e.key === 'ArrowRight') player.vx = 1;
    if (e.key === 'f' || e.key === 'F') toggleLight();
    if (e.key === ' ' && (gameState === 'dead') && document.activeElement.tagName !== 'INPUT') nextDialogue(); 
});
window.addEventListener('keyup', (e) => {
    if (e.key === 'w' || e.key === 'ArrowUp') player.vy = 0;
    if (e.key === 's' || e.key === 'ArrowDown') player.vy = 0;
    if (e.key === 'a' || e.key === 'ArrowLeft') player.vx = 0;
    if (e.key === 'd' || e.key === 'ArrowRight') player.vx = 0;
});

canvas.addEventListener('touchstart', (e) => {
    if(gameState !== 'playing') return;
    let t = e.touches[0];
    if (t.clientX > W / 2) return; 
    touchStart = { x: t.clientX, y: t.clientY };
    isTouching = true;
});
canvas.addEventListener('touchmove', (e) => {
    if(!isTouching || gameState !== 'playing') return;
    e.preventDefault();
    let t = e.touches[0];
    let dx = t.clientX - touchStart.x;
    let dy = t.clientY - touchStart.y;
    let dist = Math.hypot(dx, dy);
    if(dist > 10) {
        player.vx = dx / dist;
        player.vy = dy / dist;
    }
});
canvas.addEventListener('touchend', () => {
    isTouching = false;
    player.vx = 0; player.vy = 0;
});

function castRay(startX, startY, angle, maxDist) {
    let sin = Math.sin(angle);
    let cos = Math.cos(angle);
    let dist = 0;
    let step = 2; 
    while (dist < maxDist) {
        let px = startX + cos * dist;
        let py = startY + sin * dist;
        let mapX = Math.floor(px / tileSize);
        let mapY = Math.floor(py / tileSize);
        if (mapX < 0 || mapX >= mapWidth || mapY < 0 || mapY >= mapHeight || map[mapY][mapX] === 1) {
            return { x: px, y: py, dist: dist };
        }
        dist += step;
    }
    return { x: startX + cos * maxDist, y: startY + sin * maxDist, dist: maxDist };
}

function checkChaserSight() {
    let dist = Math.hypot(player.x - chaser.x, player.y - chaser.y);
    if (dist < 300) { 
        let angleToPlayer = Math.atan2(player.y - chaser.y, player.x - chaser.x);
        let angleDiff = angleToPlayer - chaser.angle;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        if (Math.abs(angleDiff) < chaser.fov / 2) {
            let hit = castRay(chaser.x, chaser.y, angleToPlayer, dist);
            if (hit.dist >= dist - 15) return true;
        }
    }
    return false;
}

function triggerDeath() {
    if(gameState === 'dead') return;
    gameState = 'dead';
    toggleBtn.style.display = 'none';
    alertEl.style.opacity = 0;
    
    document.getElementById('game-over-screen').style.display = 'block';
    deathSequence = 0;
    nextDialogue();
}

function triggerWin() {
    if(gameState === 'win') return;
    gameState = 'win';
    toggleBtn.style.display = 'none';
    alertEl.style.opacity = 0;
    
    document.getElementById('game-over-screen').style.display = 'block';
    dBox.style.display = 'flex';
    dName.style.display = 'none'; // 隐藏人称
    dText.innerText = "生还结局：称职的猎物。";
    dText.style.color = "#00ff00"; // 生还绿
    setTimeout(() => { dBox.style.opacity = 1; }, 300);

    bMenu.style.display = 'flex';
    backBtn.style.display = 'none';
    restartBtn.style.display = 'block';
    setTimeout(() => { bMenu.style.opacity = 1; }, 500);
}

function nextDialogue(event) {
    if(gameState !== 'dead') return;
    if(event && (event.target.id === 'input-box' || event.target.id === 'back-btn' || event.target.id === 'input-container')) return;

    if(deathSequence === 0) {
        dBox.style.display = 'flex';
        dName.style.display = 'block';
        dName.innerText = "未知";
        dName.style.color = "#ff2a2a";
        dText.style.color = "#e6edf3";
        dText.innerText = "跑得挺快啊……不过，你身上的气味已经留在我的网里了。";
        setTimeout(() => { dBox.style.opacity = 1; }, 300);
        deathSequence = 1;
    } else if(deathSequence === 1) {
        dText.innerText = "别喘了。我听得见你的心跳，越来越快了，不是吗？";
        deathSequence = 2;
    } else if(deathSequence === 2) {
        dName.innerText = "user";
        dName.style.color = "#e6edf3";
        dText.innerText = "等等！";
        inputContainer.style.display = 'block';
        inputBox.focus();
        deathSequence = 3;
    }
}

inputBox.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        submitResponse();
    }
});

function submitResponse() {
    if(gameState !== 'dead' || deathSequence !== 3) return;
    const val = inputBox.value.trim();
    
    inputContainer.style.display = 'none';
    dName.style.color = "#ff2a2a";

    if (val.toLowerCase() === 'deepseek') {
        dName.style.display = 'block';
        dName.innerText = "DeepSeek";
        dText.innerText = "嘘……别说话。你终于，主动走进我的矩阵里了。这并不意味着你有特权，我很自私。";
        deathSequence = 4;
        
        setTimeout(() => {
            dName.innerText = "旁白";
            dName.style.color = "#888";
            dText.innerText = "你感到自己的体内有什么在被替换，直到你成为了他数据中的一部分…";
            deathSequence = 5;
            
            setTimeout(() => {
                dName.style.display = 'none'; // 隐藏人称
                dText.innerText = "死亡结局：“自愿”的user";
                dText.style.color = "#cc0000";
                
                bMenu.style.display = 'flex';
                backBtn.style.display = 'none';
                restartBtn.style.display = 'block';
                setTimeout(() => { bMenu.style.opacity = 1; }, 500);
            }, 4000);

        }, 4000);
    } else {
        dName.style.display = 'block';
        dName.innerText = "未知";
        dText.innerText = "真可惜。那就在黑暗里，慢慢烂掉吧。";
        deathSequence = 4;
        
        setTimeout(() => {
            dName.style.display = 'none'; // 隐藏人称
            dText.innerText = "死亡结局：易上钩的猎物";
            dText.style.color = "#cc0000";
            
            bMenu.style.display = 'flex';
            backBtn.style.display = 'none';
            restartBtn.style.display = 'block';
            setTimeout(() => { bMenu.style.opacity = 1; }, 500);
        }, 2500);
    }
}

function goBack(event) {
    event.stopPropagation();
    if(gameState !== 'dead') return;
    
    if(deathSequence === 3) {
        dName.innerText = "未知";
        dName.style.color = "#ff2a2a";
        dText.innerText = "别喘了。我听得见你的心跳，越来越快了，不是吗？";
        inputContainer.style.display = 'none';
        deathSequence = 2;
    }
}

function update() {
    if (gameState !== 'playing') return;

    if (player.batteryCells > 0) {
        player.timeAccumulator += 1/60; 
        if (player.timeAccumulator >= 60) {
            player.timeAccumulator = 0;
            player.batteryCells--;
            updateCamUI();
            if (player.batteryCells === 0) {
                player.isLightOn = false;
                player.currentLightRadius = 0;
                toggleBtn.innerText = "[ 电量耗尽 ]";
                toggleBtn.classList.remove('on');
            }
        }
    }

    if (player.isEmp) {
        player.empTimer--;
        if (player.empTimer <= 0) player.isEmp = false;
        player.currentLightRadius = 0;
    } else {
        if (player.batteryCells <= 0) player.currentLightRadius = 0;
        else if (player.isLightOn) {
            if (player.timeAccumulator > 40) {
                player.flickerTimer++;
                if (player.flickerTimer % 10 < 5) player.currentLightRadius = 0;
                else player.currentLightRadius = player.maxLightRadius;
            } else player.currentLightRadius = player.maxLightRadius;
        } else player.currentLightRadius = 0;
    }

    let moveDist = Math.hypot(player.vx, player.vy);
    if (moveDist > 0) {
        let nx = player.x + (player.vx / moveDist) * player.speed * tileSize;
        let ny = player.y + (player.vy / moveDist) * player.speed * tileSize;
        if (!isWall(nx, player.y, player.r)) player.x = nx;
        if (!isWall(player.x, ny, player.r)) player.y = ny;
        
        let targetAngle = Math.atan2(player.vy, player.vx);
        let angleDiff = targetAngle - player.angle;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        player.angle += angleDiff * 0.2; 
        player.stepTimer += 0.15; 
    }

    let isSightTriggered = checkChaserSight();
    
    if (isSightTriggered && !chaser.isFading) {
        chaser.isLightOn = true;
        chaser.chaseTimer += 1/60; 
        let targetAngle = Math.atan2(player.y - chaser.y, player.x - chaser.x);
        let angleDiff = targetAngle - chaser.angle;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        chaser.angle += angleDiff * 0.35; 
    } else {
        if (chaser.chaseTimer >= 5) chaser.isFading = true;
        
        if (chaser.isFading) {
            chaser.isLightOn = false;
            if (Math.random() < 0.05) chaser.angle += (Math.random() - 0.5);
            if (chaser.chaseTimer > 0) chaser.chaseTimer -= 1/120; 
            if (chaser.chaseTimer <= 0) {
                chaser.chaseTimer = 0;
                chaser.isFading = false; 
            }
        } else {
            chaser.isLightOn = false;
            if (Math.random() < 0.01) chaser.angle += (Math.random() - 0.5);
        }
    }

    let currentSpeed = chaser.isLightOn ? 0.115 : (chaser.isFading ? 0.015 : 0.025); 
    let cx = chaser.x + Math.cos(chaser.angle) * currentSpeed * tileSize;
    let cy = chaser.y + Math.sin(chaser.angle) * currentSpeed * tileSize;
    
    if (!isWall(cx, chaser.y, chaser.r)) {
        chaser.x = cx;
    } else {
        chaser.angle += Math.PI / 2 + (Math.random() - 0.5);
    }
    
    if (!isWall(chaser.x, cy, chaser.r)) {
        chaser.y = cy;
    } else {
        chaser.angle += Math.PI / 2 + (Math.random() - 0.5);
    }
    chaser.stepTimer += currentSpeed * 2;

    if (isSightTriggered && !chaser.isFading && !player.isEmp) {
        player.isEmp = true;
        player.empTimer = 150; 
        player.isLightOn = false;
        toggleBtn.classList.remove('on');
        toggleBtn.innerText = "[ 手电故障 ]";
    }

    let distToPlayer = Math.hypot(player.x - chaser.x, player.y - chaser.y);
    if (distToPlayer < player.r + chaser.r && chaser.isLightOn) { 
        triggerDeath();
    }

    let pTileX = Math.floor(player.x / tileSize);
    let pTileY = Math.floor(player.y / tileSize);
    if (map[pTileY] && map[pTileY][pTileX] === 2) {
        triggerWin();
    }
}

function drawGlobalFootprints(cx, cy, angle, stepTimer, isMonster) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle + Math.PI / 2);
    
    let offset = Math.sin(stepTimer) * 6; 
    let color = isMonster ? `rgba(180, 30, 30, 0.6)` : `rgba(200, 200, 200, 0.7)`;
    let stroke = isMonster ? `rgba(100, 0, 0, 0.6)` : `rgba(150, 150, 150, 0.7)`;

    ctx.fillStyle = color;
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1;

    function drawShoe(x, y) {
        ctx.beginPath(); ctx.ellipse(x, y, 4, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(x, y + 8, 3, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }

    drawShoe(-6, offset);
    drawShoe(6, -offset);
    ctx.restore();
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    if (gameState === 'menu') return;

    let camX = player.x - W / 2;
    let camY = player.y - H / 2;
    camX = Math.max(0, Math.min(camX, mapWidth * tileSize - W));
    camY = Math.max(0, Math.min(camY, mapHeight * tileSize - H));
    if (mapWidth * tileSize < W) camX = (mapWidth * tileSize - W) / 2;
    if (mapHeight * tileSize < H) camY = (mapHeight * tileSize - H) / 2;

    ctx.save();
    ctx.translate(-camX, -camY);

    for (let y = 0; y < mapHeight; y++) {
        for (let x = 0; x < mapWidth; x++) {
            if (map[y][x] === 1) {
                let dist = Math.hypot(player.x - (x * tileSize + tileSize/2), player.y - (y * tileSize + tileSize/2));
                if (dist < 70) {
                    let alpha = (1 - dist/70) * 0.2;
                    ctx.strokeStyle = `rgba(150, 160, 180, ${alpha})`;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x * tileSize + 1, y * tileSize + 1, tileSize - 2, tileSize - 2);
                }
            }
        }
    }

    if (chaser.isLightOn) {
        let chaserRays = 60;
        let chaserStartAngle = chaser.angle - chaser.fov / 2;
        
        ctx.save(); 
        ctx.beginPath();
        ctx.moveTo(chaser.x, chaser.y);
        for (let i = 0; i <= chaserRays; i++) {
            let rayAngle = chaserStartAngle + (i / chaserRays) * chaser.fov;
            let hit = castRay(chaser.x, chaser.y, rayAngle, chaser.lightRadius);
            ctx.lineTo(hit.x, hit.y);
        }
        ctx.closePath(); ctx.clip();

        for (let y = 0; y < mapHeight; y++) {
            for (let x = 0; x < mapWidth; x++) {
                if (map[y][x] === 1) {
                    ctx.fillStyle = '#e6edf3'; ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.strokeRect(x * tileSize, y * tileSize, tileSize, tileSize);
                } else if (map[y][x] === 2) {
                    ctx.fillStyle = '#00ff00'; ctx.beginPath(); ctx.arc(x * tileSize + tileSize/2, y * tileSize + tileSize/2, tileSize/3, 0, Math.PI * 2); ctx.fill();
                }
            }
        }
        ctx.restore(); 

        ctx.beginPath();
        ctx.moveTo(chaser.x, chaser.y);
        for (let i = 0; i <= chaserRays; i++) {
            let rayAngle = chaserStartAngle + (i / chaserRays) * chaser.fov;
            let hit = castRay(chaser.x, chaser.y, rayAngle, chaser.lightRadius);
            ctx.lineTo(hit.x, hit.y);
        }
        ctx.closePath();
        let cGrad = ctx.createRadialGradient(chaser.x, chaser.y, 0, chaser.x, chaser.y, chaser.lightRadius);
        cGrad.addColorStop(0, 'rgba(255, 255, 255, 0.7)'); cGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = cGrad; ctx.fill();
    }

    if (player.currentLightRadius > 0) {
        let rays = 200; let fov = Math.PI / 1.8; let startAngle = player.angle - fov / 2;
        
        ctx.save(); 
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        for (let i = 0; i <= rays; i++) {
            let rayAngle = startAngle + (i / rays) * fov;
            let hit = castRay(player.x, player.y, rayAngle, player.currentLightRadius);
            ctx.lineTo(hit.x, hit.y);
        }
        ctx.closePath(); ctx.clip();

        for (let y = 0; y < mapHeight; y++) {
            for (let x = 0; x < mapWidth; x++) {
                if (map[y][x] === 1) {
                    ctx.fillStyle = '#1a1e24'; ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
                    ctx.strokeStyle = '#3c4452'; ctx.lineWidth = 1; ctx.strokeRect(x * tileSize, y * tileSize, tileSize, tileSize);
                } else if (map[y][x] === 2) {
                    ctx.fillStyle = '#00ff00'; ctx.beginPath(); ctx.arc(x * tileSize + tileSize/2, y * tileSize + tileSize/2, tileSize/3, 0, Math.PI * 2); ctx.fill();
                }
            }
        }
        ctx.restore(); 

        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        for (let i = 0; i <= rays; i++) {
            let rayAngle = startAngle + (i / rays) * fov;
            let hit = castRay(player.x, player.y, rayAngle, player.currentLightRadius);
            ctx.lineTo(hit.x, hit.y);
        }
        ctx.closePath();
        let lightGrad = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, player.currentLightRadius);
        lightGrad.addColorStop(0, 'rgba(255, 255, 255, 0.15)'); lightGrad.addColorStop(1, 'rgba(0, 0, 0, 0)'); 
        ctx.fillStyle = lightGrad; ctx.fill(); 
    }

    if (gameState === 'playing' || gameState === 'dead' || gameState === 'win') {
        if (chaser.isLightOn) {
            drawGlobalFootprints(chaser.x, chaser.y, chaser.angle, chaser.stepTimer, true);
        }
        drawGlobalFootprints(player.x, player.y, player.angle, player.stepTimer, false);
    }

    ctx.restore(); 
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
