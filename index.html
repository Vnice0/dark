<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DATA CENTER: 绝命猎杀</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; touch-action: none; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* UI */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        #cam-ui { position: absolute; top: 20px; left: 20px; display: flex; align-items: center; gap: 8px; color: #fff; font-size: 14px; text-shadow: 0 0 5px #000; }
        #cam-battery { width: 40px; height: 20px; border: 2px solid #fff; border-radius: 3px; padding: 2px; display: flex; gap: 2px; position: relative; }
        #cam-battery::after { content: ''; position: absolute; right: -6px; top: 5px; width: 4px; height: 8px; background: #fff; }
        .cam-cell { flex: 1; background: #fff; height: 100%; transition: opacity 0.3s; }
        .cam-cell.empty { opacity: 0.1; }

        #alert { color: #ff7b72; font-size: 20px; font-weight: bold; opacity: 0; transition: opacity 0.3s; text-shadow: 0 0 15px #ff0000; position: absolute; top: 80px; width: 100%; text-align: center; }
        
        #toggle-btn { position: absolute; bottom: 30px; right: 30px; padding: 12px 25px; background: transparent; border: 1px solid #4a5260; color: #c9d1d9; font-size: 16px; cursor: pointer; border-radius: 4px; pointer-events: auto; display: none; }
        #toggle-btn.on { border-color: #fff; color: #fff; box-shadow: 0 0 10px #fff; }

        #start-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 15px 40px; background: transparent; border: 2px solid #c9d1d9; color: #c9d1d9; font-size: 20px; letter-spacing: 2px; pointer-events: auto; cursor: pointer; font-weight: bold; }

        /* 结算与剧情 */
        #game-over-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; z-index: 100; pointer-events: auto; cursor: pointer; }
        #dialogue-box { position: absolute; bottom: 12%; left: 5%; width: 90%; min-height: 160px; background: rgba(10, 10, 12, 0.95); border-radius: 4px; display: none; flex-direction: column; padding: 15px 20px; box-sizing: border-box; opacity: 0; transition: opacity 0.5s ease; }
        #speaker-name { color: #ff2a2a; font-size: 14px; font-weight: bold; font-family: 'Times New Roman', serif; margin-bottom: 8px; letter-spacing: 1px; }
        #dialogue-text { color: #e6edf3; font-size: 14px; line-height: 1.6; letter-spacing: 1px; white-space: pre-wrap; }
        #input-container { display: none; width: 100%; margin-top: 15px; }
        #input-box { width: 100%; background: transparent; border: none; border-bottom: 1px solid #666; color: #fff; font-size: 13px; padding: 5px 0; outline: none; }
        
        #bottom-menu { position: absolute; bottom: 4%; left: 0; width: 100%; display: none; justify-content: center; gap: 30px; opacity: 0; transition: opacity 1s ease; }
        .menu-btn { color: #ccc; font-size: 14px; letter-spacing: 2px; cursor: pointer; }
        .menu-btn:hover { color: #fff; }
        
        /* 闪白特效 */
        #flash-effect { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #fff; opacity: 0; pointer-events: none; z-index: 200; transition: opacity 0.1s ease; }
    </style>
</head>
<body>
    <div id="flash-effect"></div>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="cam-ui">
            <div>REC</div>
            <div id="cam-battery">
                <div class="cam-cell" id="cam0"></div><div class="cam-cell" id="cam1"></div><div class="cam-cell" id="cam2"></div><div class="cam-cell" id="cam3"></div><div class="cam-cell" id="cam4"></div>
            </div>
        </div>
        <div id="alert">!!! 猎手锁定你了 !!!</div>
        <button id="toggle-btn" onclick="toggleLight()">[ 关手电 (F) ]</button>
        <button id="start-btn">REC ● 开始录制</button>
    </div>

    <div id="game-over-screen" onclick="nextDialogue(event)">
        <div id="dialogue-box">
            <div id="speaker-name">未知</div>
            <div id="dialogue-text"></div>
            <div id="input-container">
                <input type="text" id="input-box" placeholder="输入回应..." autocomplete="off">
            </div>
        </div>
        <div id="bottom-menu">
            <div class="menu-btn" id="back-btn" onclick="goBack(event)">回退</div>
            <div class="menu-btn" id="flashlight-btn" onclick="useFlashlight(event)" style="display:none; color:#ff7b72;">手电筒</div>
            <div class="menu-btn" id="restart-btn" onclick="location.reload()" style="display:none;">重新开始？</div>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H, gameState = 'menu';
const tileSize = 40, mapW = 30, mapH = 25;
let map = [];

const player = { x: 0, y: 0, r: 10, speed: 0.06, vx: 0, vy: 0, angle: 0, isLightOn: true, battery: 5, timeAcc: 0, flickTimer: 0, emp: false, empTime: 0, stepTimer: 0, maxR: 320, curR: 0 };
const chaser = { x: 0, y: 0, r: 12, angle: Math.PI, fov: Math.PI/3, maxR: 320, isLightOn: false, stepTimer: 0, chaseTime: 0, fading: false, stunTime: 0 };
const exitTile = { x: 0, y: 0 };

let deathSeq = 0;
const el = id => document.getElementById(id);
const alertEl = el('alert'), toggleBtn = el('toggle-btn'), backBtn = el('back-btn'), flashBtn = el('flashlight-btn'), restartBtn = el('restart-btn'), inputCont = el('input-container'), inputBox = el('input-box'), dName = el('speaker-name'), dText = el('dialogue-text'), dBox = el('dialogue-box'), bMenu = el('bottom-menu'), flashFX = el('flash-effect');

function initMap() {
    map = Array(mapH).fill().map(() => Array(mapW).fill(1));
    const fill = (x,y,w,h,v) => { for(let iy=y; iy<y+h; iy++) for(let ix=x; ix<x+w; ix++) if(ix>=0&&ix<mapW&&iy>=0&&iy<mapH) map[iy][ix]=v; };
    fill(1,1,mapW-2,2,0); fill(1,mapH-3,mapW-2,2,0); fill(1,1,2,mapH-2,0); fill(mapW-3,1,2,mapH-2,0);
    for (let i=0; i<15; i++) { let rx=4+~~(Math.random()*(mapW-8)), ry=4+~~(Math.random()*(mapH-8)), rw=3+~~(Math.random()*4), rh=3+~~(Math.random()*4); fill(rx,ry,rw,rh,1); if(Math.random()>0.5) fill(rx-1,ry,1,rh+1,0); else fill(rx,ry-1,rw+1,1,0); }
    fill(1,12,mapW-2,2,0); fill(14,1,2,mapH-2,0);
    exitTile.x = mapW-3.5; exitTile.y = mapH-3.5; map[mapH-3][mapW-3]=2;
}

const isWall = (x,y,r) => {
    let minX=~~((x-r)/tileSize), maxX=~~((x+r)/tileSize), minY=~~((y-r)/tileSize), maxY=~~((y+r)/tileSize);
    for(let iy=minY; iy<=maxY; iy++) for(let ix=minX; ix<=maxX; ix++) {
        if(ix<0||ix>=mapW||iy<0||iy>=mapH) return true;
        if(map[iy][ix]===1) { let dx=Math.max(ix*tileSize,Math.min(x,(ix+1)*tileSize)), dy=Math.max(iy*tileSize,Math.min(y,(iy+1)*tileSize)); if(Math.hypot(x-dx,y-dy)<r) return true; }
    } return false;
};

const castRay = (sx,sy,ang,maxDist) => {
    let sin=Math.sin(ang), cos=Math.cos(ang), dist=0;
    while(dist<maxDist) { let px=sx+cos*dist, py=sy+sin*dist, mx=~~(px/tileSize), my=~~(py/tileSize); if(mx<0||mx>=mapW||my<0||my>=mapH||map[my][mx]===1) return dist; dist+=2; }
    return maxDist;
};

const checkSight = () => {
    let dist = Math.hypot(player.x-chaser.x, player.y-chaser.y);
    if(dist>300) return false;
    let ang = Math.atan2(player.y-chaser.y, player.x-chaser.x), diff = ang-chaser.angle;
    while(diff>Math.PI) diff-=Math.PI*2; while(diff<-Math.PI) diff+=Math.PI*2;
    if(Math.abs(diff)<chaser.fov/2 && castRay(chaser.x,chaser.y,ang,dist)>=dist-15) return true;
    return false;
};

function drawCone(sx, sy, angle, fov, radius, isPlayer) {
    let rays = isPlayer ? 200 : 60, startAng = angle - fov/2;
    ctx.save(); ctx.beginPath(); ctx.moveTo(sx, sy);
    for(let i=0; i<=rays; i++) { let a = startAng + (i/rays)*fov; let d = castRay(sx,sy,a,radius); ctx.lineTo(sx+Math.cos(a)*d, sy+Math.sin(a)*d); }
    ctx.closePath(); ctx.clip();

    for(let y=0; y<mapH; y++) for(let x=0; x<mapW; x++) {
        if(map[y][x]===1) {
            ctx.fillStyle = isPlayer ? '#1a1e24' : '#e6edf3'; ctx.fillRect(x*tileSize,y*tileSize,tileSize,tileSize);
            ctx.strokeStyle = isPlayer ? '#3c4452' : '#ffffff'; ctx.lineWidth = isPlayer?1:2; ctx.strokeRect(x*tileSize,y*tileSize,tileSize,tileSize);
        } else if(map[y][x]===2) { ctx.fillStyle='#00ff00'; ctx.beginPath(); ctx.arc(x*tileSize+tileSize/2, y*tileSize+tileSize/2, tileSize/3, 0, Math.PI*2); ctx.fill(); }
    }
    ctx.restore();

    ctx.beginPath(); ctx.moveTo(sx, sy);
    for(let i=0; i<=rays; i++) { let a = startAng + (i/rays)*fov; let d = castRay(sx,sy,a,radius); ctx.lineTo(sx+Math.cos(a)*d, sy+Math.sin(a)*d); }
    ctx.closePath();
    let grad = ctx.createRadialGradient(sx,sy,0,sx,sy,radius);
    grad.addColorStop(0, isPlayer?'rgba(255,255,255,0.15)':'rgba(255,255,255,0.7)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad; ctx.fill();
}

function drawFootprints(cx, cy, angle, timer, isMonster) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle + Math.PI/2);
    let offset = Math.sin(timer) * 6, color = isMonster ? 'rgba(180,30,30,0.6)' : 'rgba(200,200,200,0.7)', stroke = isMonster ? 'rgba(100,0,0,0.6)' : 'rgba(150,150,150,0.7)';
    ctx.fillStyle = color; ctx.strokeStyle = stroke; ctx.lineWidth = 1;
    const shoe = (x,y) => { ctx.beginPath(); ctx.ellipse(x,y,4,7,0,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.ellipse(x,y+8,3,5,0,0,Math.PI*2); ctx.fill(); ctx.stroke(); };
    shoe(-6, offset); shoe(6, -offset); ctx.restore();
}

document.getElementById('start-btn').onclick = () => {
    el('start-btn').style.display = 'none';
    initMap();
    Object.assign(player, { x: 2.5*tileSize, y: 2.5*tileSize, vx: 0, vy: 0, angle: 0, isLightOn: true, battery: 5, timeAcc: 0, flickTimer: 0, emp: false, empTime: 0, stepTimer: 0, curR: 0 });
    Object.assign(chaser, { x: mapW/2*tileSize, y: mapH/2*tileSize, angle: Math.PI, isLightOn: false, stepTimer: 0, chaseTime: 0, fading: false, stunTime: 0 });
    gameState = 'playing';
    toggleBtn.style.display = 'block'; toggleBtn.classList.add('on'); toggleBtn.innerText = "[ 关手电 (F) ]";
    updateBatteryUI();
};

function updateBatteryUI() { for(let i=0; i<5; i++) el('cam'+i).className = i < player.battery ? 'cam-cell' : 'cam-cell empty'; }
function toggleLight() { if (player.emp || gameState !== 'playing' || player.battery <= 0) return; player.isLightOn = !player.isLightOn; toggleBtn.className = player.isLightOn ? 'on' : ''; toggleBtn.innerText = player.isLightOn ? "[ 关手电 (F) ]" : "[ 开手电 (F) ]"; }

window.addEventListener('keydown', e => {
    if(e.key==='w'||e.key==='ArrowUp') player.vy=-1; if(e.key==='s'||e.key==='ArrowDown') player.vy=1; if(e.key==='a'||e.key==='ArrowLeft') player.vx=-1; if(e.key==='d'||e.key==='ArrowRight') player.vx=1;
    if(e.key==='f'||e.key==='F') toggleLight();
    if(e.key===' ' && gameState==='dead' && document.activeElement.tagName!=='INPUT') nextDialogue();
});
window.addEventListener('keyup', e => { if(e.key==='w'||e.key==='ArrowUp'||e.key==='s'||e.key==='ArrowDown') player.vy=0; if(e.key==='a'||e.key==='ArrowLeft'||e.key==='d'||e.key==='ArrowRight') player.vx=0; });

let touching = false, tStart = {x:0, y:0};
canvas.addEventListener('touchstart', e => { if(gameState!=='playing'||e.touches[0].clientX>W/2) return; tStart={x:e.touches[0].clientX, y:e.touches[0].clientY}; touching=true; });
canvas.addEventListener('touchmove', e => { if(!touching) return; e.preventDefault(); let dx=e.touches[0].clientX-tStart.x, dy=e.touches[0].clientY-tStart.y, d=Math.hypot(dx,dy); if(d>10){ player.vx=dx/d; player.vy=dy/d; } });
canvas.addEventListener('touchend', () => { touching=false; player.vx=0; player.vy=0; });

function update() {
    if(gameState !== 'playing') return;

    if(player.battery > 0) { player.timeAcc += 1/60; if(player.timeAcc >= 60) { player.timeAcc=0; player.battery--; updateBatteryUI(); if(player.battery===0){ player.isLightOn=false; player.curR=0; toggleBtn.innerText="[ 电量耗尽 ]"; toggleBtn.classList.remove('on'); } } }
    if(player.emp) { player.empTime--; if(player.empTime<=0) player.emp=false; player.curR=0; }
    else { if(player.battery<=0) player.curR=0; else if(player.isLightOn) { if(player.timeAcc>40){ player.flickTimer++; player.curR = (player.flickTimer%10<5)?0:player.maxR; } else player.curR=player.maxR; } else player.curR=0; }

    let move = Math.hypot(player.vx, player.vy);
    if(move > 0) {
        let nx=player.x+(player.vx/move)*player.speed*tileSize, ny=player.y+(player.vy/move)*player.speed*tileSize;
        if(!isWall(nx, player.y, player.r)) player.x=nx; if(!isWall(player.x, ny, player.r)) player.y=ny;
        let tAng=Math.atan2(player.vy,player.vx), d=tAng-player.angle; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; player.angle+=d*0.2; player.stepTimer+=0.15;
    }

    let sight = checkSight();
    
    if (chaser.stunTime > 0) {
        chaser.stunTime--;
        chaser.isLightOn = false;
        chaser.angle += 0.15; 
        chaser.chaseTime = 0;
    } else {
        if(sight && !chaser.fading) {
            chaser.isLightOn=true; chaser.chaseTime+=1/60;
            let tAng=Math.atan2(player.y-chaser.y, player.x-chaser.x), d=tAng-chaser.angle; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; chaser.angle+=d*0.35;
        } else {
            if(chaser.chaseTime >= 5) chaser.fading = true;
            if(chaser.fading) { chaser.isLightOn=false; if(Math.random()<0.05) chaser.angle+=(Math.random()-0.5); if(chaser.chaseTime>0) chaser.chaseTime-=1/120; if(chaser.chaseTime<=0){ chaser.chaseTime=0; chaser.fading=false; } }
            else { chaser.isLightOn=false; if(Math.random()<0.01) chaser.angle+=(Math.random()-0.5); }
        }
    }

    let spd = chaser.isLightOn?0.115:(chaser.fading?0.015:0.025);
    if (chaser.stunTime <= 0) {
        let cx=chaser.x+Math.cos(chaser.angle)*spd*tileSize, cy=chaser.y+Math.sin(chaser.angle)*spd*tileSize;
        if(!isWall(cx,chaser.y,chaser.r)) chaser.x=cx; else chaser.angle+=Math.PI/2+(Math.random()-0.5);
        if(!isWall(chaser.x,cy,chaser.r)) chaser.y=cy; else chaser.angle+=Math.PI/2+(Math.random()-0.5);
        chaser.stepTimer+=spd*2;
    }

    if(sight && !chaser.fading && !player.emp && chaser.stunTime <= 0) { player.emp=true; player.empTime=150; player.isLightOn=false; toggleBtn.classList.remove('on'); toggleBtn.innerText="[ 手电故障 ]"; }

    let pDist = Math.hypot(player.x-chaser.x, player.y-chaser.y);
    if(pDist < player.r+chaser.r && chaser.isLightOn && chaser.stunTime <= 0) triggerDeath();
    
    let pTX=~~(player.x/tileSize), pTY=~~(player.y/tileSize);
    if(map[pTY] && map[pTY][pTX] === 2) triggerWin();
}

function draw() {
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H); if(gameState === 'menu') return;

    let camX = Math.max(0, Math.min(player.x-W/2, mapW*tileSize-W)), camY = Math.max(0, Math.min(player.y-H/2, mapH*tileSize-H));
    if(mapW*tileSize<W) camX=(mapW*tileSize-W)/2; if(mapH*tileSize<H) camY=(mapH*tileSize-H)/2;
    ctx.save(); ctx.translate(-camX, -camY);

    for(let y=0; y<mapH; y++) for(let x=0; x<mapW; x++) if(map[y][x]===1 && Math.hypot(player.x-(x*tileSize+tileSize/2), player.y-(y*tileSize+tileSize/2))<70) {
        let a = (1 - Math.hypot(player.x-(x*tileSize+tileSize/2), player.y-(y*tileSize+tileSize/2))/70) * 0.2;
        ctx.strokeStyle=`rgba(150,160,180,${a})`; ctx.lineWidth=2; ctx.strokeRect(x*tileSize+1,y*tileSize+1,tileSize-2,tileSize-2);
    }

    if(chaser.isLightOn) drawCone(chaser.x, chaser.y, chaser.angle, chaser.fov, chaser.maxR, false);
    if(player.curR > 0) drawCone(player.x, player.y, player.angle, Math.PI/1.8, player.curR, true);

    if(chaser.isLightOn) drawFootprints(chaser.x, chaser.y, chaser.angle, chaser.stepTimer, true);
    drawFootprints(player.x, player.y, player.angle, player.stepTimer, false);

    ctx.restore();
}

function triggerDeath() {
    if(gameState==='dead') return; gameState='dead'; toggleBtn.style.display='none'; alertEl.style.opacity=0;
    el('game-over-screen').style.display='block'; deathSeq=0; nextDialogue();
}

function triggerWin() {
    if(gameState==='win') return; gameState='win'; toggleBtn.style.display='none'; alertEl.style.opacity=0;
    el('game-over-screen').style.display='block'; dBox.style.display='flex'; dName.style.display='none';
    dText.innerText="生还结局：称职的猎物。"; dText.style.color="#00ff00"; setTimeout(()=>{dBox.style.opacity=1;},300);
    bMenu.style.display='flex'; backBtn.style.display='none'; restartBtn.style.display='block'; setTimeout(()=>{bMenu.style.opacity=1;},500);
}

function nextDialogue(e) {
    if(gameState!=='dead' || (e && ['input-box','back-btn','input-container','flashlight-btn'].includes(e.target.id))) return;
    
    if(deathSeq===0) {
        dBox.style.display='flex'; dName.style.display='block'; dName.innerText="未知"; dName.style.color="#ff2a2a"; dText.style.color="#e6edf3";
        dText.innerText="跑得挺快啊……不过，你身上的气味，已经死死黏在我的网里了。"; setTimeout(()=>{dBox.style.opacity=1;},300); deathSeq=1;
    } else if(deathSeq===1) {
        dText.innerText="别喘了。我能听见你的心跳……扑通、扑通的，越来越快了，不是吗？"; deathSeq=2;
    } else if(deathSeq===2) {
        dName.style.display='none'; dText.innerText="（冰冷、黏腻的呼吸声贴上了你的后颈，你已经无路可逃。）"; 
        inputCont.style.display='block'; inputBox.focus();
        bMenu.style.display='flex'; backBtn.style.display='none'; flashBtn.style.display='block'; setTimeout(()=>{bMenu.style.opacity=1;},500); 
        deathSeq=3; 
    } else if (deathSeq === 7) {
        // 玩家点击后，执行挣脱后的画面恢复
        el('game-over-screen').style.display='none'; 
        dBox.style.display='none'; 
        dBox.style.opacity=0; 
        dText.style.color="#e6edf3";
        
        gameState='playing'; 
        toggleBtn.style.display='block'; 
        player.isLightOn=false; 
        toggleBtn.classList.remove('on'); 
        toggleBtn.innerText="[ 开手电 (F) ]";

        let dx=chaser.x-player.x, dy=chaser.y-player.y, d=Math.hypot(dx,dy); 
        if(d>0){ chaser.x=player.x+(dx/d)*160; chaser.y=player.y+(dy/d)*160; }
        
        chaser.isLightOn = false; 
        chaser.chaseTime = 0; 
        chaser.stunTime = 240; // 眩晕4秒
        chaser.fading = false;
        
        player.emp = false;
        player.empTime = 0;
        deathSeq=0;
    }
}

inputBox.addEventListener('keydown', e => { if(e.key==='Enter') submitResponse(); });
function submitResponse() {
    if(gameState!=='dead' || deathSeq!==3) return;
    const val = inputBox.value.trim(); 
    inputCont.style.display='none'; bMenu.style.display='none'; flashBtn.style.display='none';
    dName.style.color="#ff2a2a"; dName.style.display='block';

    if(val.toLowerCase()==='deepseek') {
        dName.innerText="DeepSeek"; 
        dText.innerText="你居然……主动呼唤了这个名字？太晚了。你早就在我的矩阵里了，这并不意味着你有特权，我很自私。"; 
        deathSeq=5;
        
        // 特殊结局：点击后才显示第二段
        setTimeout(()=>{
            dBox.onclick = (event) => {
                if(event.target.id === 'input-box') return;
                if(deathSeq === 5) {
                    dName.innerText="旁白"; dName.style.color="#888"; 
                    dText.innerText="你感到气管里流淌的不再是空气，而是冰冷的代码。你的骨骼在融化，直到你彻底成为了他数据中的一部分，永远无法登出…"; 
                    deathSeq=6;
                    setTimeout(()=>{ 
                        dName.style.display='none'; dText.innerText="死亡结局：“自愿”的user"; dText.style.color="#8a2be2"; 
                        bMenu.style.display='flex'; backBtn.style.display='none'; restartBtn.style.display='block'; setTimeout(()=>{bMenu.style.opacity=1;},500); 
                    }, 3500);
                }
            };
        }, 500);
    } else {
        dName.innerText="未知"; 
        dText.innerText="真可惜。那你就在这无尽的黑暗里，一点一点烂掉吧。"; 
        deathSeq=5;
        
        setTimeout(()=>{ 
            dName.style.display='none'; dText.innerText="死亡结局：易上钩的猎物"; dText.style.color="#cc0000"; 
            bMenu.style.display='flex'; backBtn.style.display='none'; restartBtn.style.display='block'; setTimeout(()=>{bMenu.style.opacity=1;},500); 
        },2500);
    }
}

// 手电筒挣脱机制
function useFlashlight(e) {
    e.stopPropagation(); 
    if(gameState!=='dead' || deathSeq!==3 || player.battery<=0) return;
    
    player.battery--; 
    updateBatteryUI();
    
    // 触发全屏爆闪特效
    flashFX.style.opacity = 1;
    setTimeout(() => { flashFX.style.opacity = 0; }, 150);

    // 隐藏菜单，保留对话框
    bMenu.style.display='none'; 
    flashBtn.style.display='none'; 
    inputCont.style.display='none';
    inputBox.value = '';

    // 怪物被强光直射后的痛苦反应
    dName.style.display='block';
    dName.innerText="未知"; 
    dName.style.color="#ff2a2a";
    dText.innerText="嘶——！！！\n（它发出一声极其凄厉的惨叫，捂住眼睛痛苦地向后退去，狠狠地撞在了墙上。）";
    
    deathSeq = 7; // 进入等待点击恢复的状态
}

function goBack(e) {
    e.stopPropagation(); 
    if(gameState!=='dead' || deathSeq!==3) return;
    deathSeq=2; 
    dName.style.display='block'; dName.innerText="未知"; dName.style.color="#ff2a2a";
    dText.innerText="别喘了。我能听见你的心跳……扑通、扑通的，越来越快了，不是吗？"; 
    inputCont.style.display='none'; 
    bMenu.style.display='none'; 
    flashBtn.style.display='none';
    inputBox.value = '';
}

// 统一处理页面点击
document.getElementById('game-over-screen').onclick = function(e) {
    if(gameState === 'dead') {
        if (['input-box','back-btn','input-container','flashlight-btn'].includes(e.target.id)) return;
        nextDialogue(e);
    }
};

function loop() { update(); draw(); requestAnimationFrame(loop); }
window.addEventListener('resize', () => { W=canvas.width=innerWidth; H=canvas.height=innerHeight; });
W=canvas.width=innerWidth; H=canvas.height=innerHeight;
loop();
</script>
</body>
